# A check, separate from renovate.yml, which RUNS Renovate.
#
# renovate.yml holds the org's token and is driven by a schedule; it must not
# gain a pull_request trigger. So the checks live here with `contents: read`
# and nothing else — and this is what a pull request in this repository gets
# judged on. It had nothing, which matters more here than in most repositories:
# every repo in this organisation extends the preset in this one, so a broken
# default.json does not break this repository, it quietly stops Renovate
# everywhere.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    name: the Renovate configuration is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: '22' }

      # PROVES: Renovate itself accepts these files. renovate-config-validator
      # is the tool Renovate ships for exactly this, so the judge and the
      # subject agree by construction rather than by resemblance.
      #
      # Checked against a deliberately broken default.json before this was
      # committed: an invalid `schedule` and an unknown key both give
      # "ERROR: Found errors in configuration" and exit 1.
      - name: renovate-config-validator
        run: npx -y --package renovate renovate-config-validator config.js default.json renovate.json

  workflows:
    name: the workflows are well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          files: ".github/workflows/*.yml"
